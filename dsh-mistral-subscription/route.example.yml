llm-pi-ai:
  providers:
    mistral-subscription:
      api: openai-completions
      baseURL: https://api.mistral.ai/v1
      # Mistral's API rejects OpenAI-only body fields with 422 extra_forbidden:
      # store, the developer role, and reasoning_effort (except none/high on
      # some models). Disable all three at the route level.
      compat:
        supportsStore: false
        supportsDeveloperRole: false
        supportsReasoningEffort: false
      models:
        - id: zai-glm-5-3
          contextWindow: 1048576
          maxTokens: 32768
        - id: mistral-medium-2604
          contextWindow: 262144
          maxTokens: 32768
        - id: mistral-small-latest
          contextWindow: 262144
          maxTokens: 32768
      - provider: mistral-subscription
        model: zai-glm-5-3
