# Example route for the Mistral subscription (Vibe Code quota).
#
# Single YAML document: a top-level LIST of settings entries, matching the
# shape of ~/.dsh/profiles/*/cordis.patch.yml. Merge the entries you need.
#
# With `api: openai-completions`, pi-ai's delta parser reads only STRING
# content; Mistral streams typed-array content blocks as soon as thinking is
# engaged. The parser itself cannot be taught to read arrays — the parser
# that can (`mistral-conversations`) is not reachable from a hand-declared
# route — so the localhost normalizer translates the arrays into strings on
# the way back, keyed on the response shape (see the compat block below).
# Reasoning ladders below are live-verified per model. The complete inventory
# and the stream-shape evidence are at the bottom of this file.
- id: llm-pi-ai
  config:
    providers:
      mistral-subscription:
        api: openai-completions
        # Through the plugin's localhost normalizer (lib/proxy.js), NOT the
        # origin: pi-ai replays session history verbatim and a conversation
        # previously run on another provider can carry `reasoning_content` on
        # assistant messages, which Mistral rejects with 422 extra_forbidden.
        # The normalizer strips those fields before forwarding to
        # https://api.mistral.ai. Port must match the plugin bundle config.
        baseURL: http://127.0.0.1:8477/v1
        # Mistral's API rejects OpenAI-only body fields with 422
        # extra_forbidden: `store` and the `developer` role. Both are
        # disabled here.
        #
        # reasoning_effort IS accepted, as a top-level string (probed
        # 2026-11-08); the old `thinking:{...}` object shape still 422s, so
        # only the string form is ever sent. Thinking on makes every model
        # below stream typed-array content, which the normalizer translates
        # into reasoning_content/content — the translation is keyed on the
        # response SHAPE now, not on a GLM model id, so mistral-medium/small
        # and deepseek flash are covered too.
        compat:
          supportsStore: false
          supportsDeveloperRole: false
          supportsReasoningEffort: true
        # ACTIVE set. deepseek-v4-1-flash-1017 is the primary model: this
        # route exists to serve it. Ordered, first model wins the picker
        # default in some surfaces.
        models:
          - id: deepseek-v4-1-flash-1017
            contextWindow: 1048576
            maxTokens: 32768
            input:
              - text
              - image
            reasoningEfforts:
              off: none
              low: low
              high: high
              xhigh: xhigh
              max: max
          # Z.ai GLM family served by Mistral: nonstandard content blocks
          # (thinking arrays + text/string answer). The normalizer translates
          # them to reasoning_content/content on the way back — without it
          # pi-ai fails with "text-delta text must be a string". No `off`
          # level: "none" does not disable GLM thinking, so the ladder simply
          # omits it. Text-only: image input unverified through this route.
          - id: zai-glm-5-3
            contextWindow: 1048576
            maxTokens: 32768
            input:
              - text
            reasoningEfforts:
              low: low
              high: high
              max: max
          - id: zai-glm-5-3-flash
            contextWindow: 1048576
            maxTokens: 32768
            input:
              - text
            reasoningEfforts:
              low: low
              high: high
              max: max
          - id: glm-5-2
            contextWindow: 1048576
            maxTokens: 32768
            input:
              - text
            reasoningEfforts:
              off: none
              low: low
              high: high
              max: max
          - id: mistral-medium-2604
            contextWindow: 262144
            maxTokens: 32768
            input:
              - text
              - image
            reasoningEfforts:
              off: none
              high: high
          - id: mistral-small-latest
            contextWindow: 262144
            maxTokens: 32768
            input:
              - text
              - image
            reasoningEfforts:
              off: none
              high: high
          - id: ministral-14b-2512
            contextWindow: 262144
            maxTokens: 32768
            input:
              - text
              - image
            reasoningEfforts: false
          - id: ministral-8b-2512
            contextWindow: 262144
            maxTokens: 32768
            input:
              - text
              - image
            reasoningEfforts: false
          - id: ministral-3b-2512
            contextWindow: 131072
            maxTokens: 32768
            input:
              - text
              - image
            reasoningEfforts: false
          - id: codestral-2508
            contextWindow: 256000
            maxTokens: 32768
            input:
              - text
            reasoningEfforts: false
- id: subagent-model-selection-settings
  config:
    enabled: true
    # One entry: the primary model of this route. Add more from the ACTIVE
    # set above only if the subagent workflow needs them.
    allowedModels:
      - provider: mistral-subscription
        model: deepseek-v4-1-flash-1017

# =========================================================================
# INVENTORY — complete chat-capable model set of the subscription.
# Catalog snapshot 2026-11-08 (GET /v1/models, collapsed by the `name` field
# to canonical ids; aliases listed where the route pins one). Stream verdicts
# are live probes: a "strings" model streams delta.content as strings and
# works here; an "arrays" model streams typed-array blocks and fails with
# `text-delta text must be a string` on this protocol.
#
# canonical                  | verdict
# ---------------------------+--------------------------------------------
# deepseek-v4-1-flash-1017   | strings without thinking, arrays with thinking
#                            |   -> ACTIVE, primary
# mistral-medium-latest      | strings without thinking, arrays with thinking
#                            |   -> ACTIVE as pinned alias mistral-medium-2604
# mistral-small-2603         | strings without thinking, arrays with thinking
#                            |   -> ACTIVE as pinned alias mistral-small-latest
# ministral-14b-2512         | non-reasoning -> ACTIVE
# ministral-8b-2512          | non-reasoning -> ACTIVE
# ministral-3b-2512          | non-reasoning -> ACTIVE
# codestral-2508             | non-reasoning -> ACTIVE (text-only input)
# mistral-large-2512         | UNVERIFIED -> held out until its stream shape
#                            |   is probed
# mistral-large-4            | arrays -> excluded; returns when
#                            |   mistral-conversations is reachable
# glm-5-2                    | arrays (GLM family); thinking arrays + string
#                            |   answer translate in the normalizer -> ACTIVE
# zai-glm-5-3                | arrays (GLM family) -> ACTIVE via the
#                            |   normalizer's shape-keyed translation
# zai-glm-5-3-flash          | arrays (GLM family) -> ACTIVE via the
#                            |   normalizer's shape-keyed translation
# labs-leanstral-1-5-1       | org-admin gated -> excluded
# Voxtral Small Transcribe   | transcription model behind the chat flag
#                            |   -> excluded
#
# Embed / OCR / TTS / moderation models also exist in the catalog and are
# excluded wholesale (not chat-completion models).
#
# Two follow-ups unlock the excluded families:
#   1. DSH exposing the `mistral-conversations` protocol to hand-declared
#      routes: switch `api`, drop the compat block and re-read the arrays
#      natively, and re-add the GLM / large-4 family.
#   2. A stream-shape probe of mistral-large-2512; add it if it streams
#      strings without a ladder.
# Aliases deliberately not pinned (medium-3, small-2603, ministral-*-latest,
# codestral-latest, ...) resolve through the canonical ids above; pin an
# alias only when a caller already names it.
